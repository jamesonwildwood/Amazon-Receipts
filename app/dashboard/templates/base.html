<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Amazon Receipts{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/review">Pending Review</a>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
